name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (build, tests, Vulkan screenshots)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev xvfb mesa-vulkan-drivers vulkan-validationlayers \
                                  vulkan-tools glslang-tools python3-pil

      - name: Check committed SPIR-V matches the shader sources
        run: |
          python3 tools/compile_shaders.py glslangValidator
          git diff --exit-code src/gfx/shaders_spv.h || (echo "::warning::shaders_spv.h differs from a fresh compile (compiler version differences are OK)")

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Sample FBX characters (downloaded for testing, not part of the repo)
        run: |
          mkdir -p $RUNNER_TEMP/fbx
          for f in "Samba%20Dancing.fbx" "mixamo.fbx"; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/fbx/${f//%20/ }" "https://raw.githubusercontent.com/mrdoob/three.js/r170/examples/models/fbx/$f" || true
          done
          ls -la $RUNNER_TEMP/fbx
          if [ -s "$RUNNER_TEMP/fbx/Samba Dancing.fbx" ] && [ -s "$RUNNER_TEMP/fbx/mixamo.fbx" ]; then
            echo "LUXORA_TEST_FBX_DIR=$RUNNER_TEMP/fbx" >> $GITHUB_ENV
            echo "LUXORA_SMOKE_FBX_DIR=$RUNNER_TEMP/fbx" >> $GITHUB_ENV
          else echo "::warning::sample FBX download failed - model tests skipped"; fi

      - name: Unit tests
        run: ./build/luxora_tests

      - name: Editor smoke test (no GPU)
        run: |
          export HOME=$RUNNER_TEMP/home && mkdir -p $HOME
          LUXORA_NO_AUDIO=1 xvfb-run -a -s "-screen 0 1600x940x24" ./build/luxora_editor_nogpu --new $RUNNER_TEMP/projects "CI Sample" --smoke

      - name: Editor stress test (random heavy use, sanitizers)
        run: |
          export HOME=$RUNNER_TEMP/home
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan --target luxora_editor_nogpu
          LUXORA_NO_AUDIO=1 xvfb-run -a ./build-asan/luxora_editor_nogpu --new $RUNNER_TEMP/stress "Stress" --screenshot /dev/null --frames 3
          P="$RUNNER_TEMP/stress/Stress"
          if [ -n "$LUXORA_SMOKE_FBX_DIR" ]; then mkdir -p "$P/Assets/Models" && cp "$LUXORA_SMOKE_FBX_DIR"/*.fbx "$P/Assets/Models/"; fi
          for seed in 1 2 3; do
            rm -rf "$RUNNER_TEMP/s$seed" && cp -r "$P" "$RUNNER_TEMP/s$seed"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            LUXORA_NO_AUDIO=1 LUXORA_STRESS_SEED=$seed LUXORA_STRESS_PROJECT="$RUNNER_TEMP/s$seed" \
              xvfb-run -a -s "-screen 0 1600x940x24" ./build-asan/luxora_editor_nogpu "$RUNNER_TEMP/s$seed" --stress 1500 > stress$seed.log 2>&1 \
              || { tail -80 stress$seed.log; grep -E "BROKEN" -A2 stress$seed.log | head -40; exit 1; }
            grep "\[stress\] done" stress$seed.log
          done

      - name: Build a game from the editor pipeline
        run: |
          export HOME=$RUNNER_TEMP/home
          LUXORA_NO_AUDIO=1 xvfb-run -a -s "-screen 0 1600x940x24" ./build/luxora_editor_nogpu "$RUNNER_TEMP/projects/CI Sample" --build
          ls -la "$RUNNER_TEMP/projects/CI Sample/Builds/Linux/CI Sample"

      - name: Vulkan runtime (lavapipe + validation layers)
        run: |
          vulkaninfo --summary || true
          export HOME=$RUNNER_TEMP/home
          export LUXORA_VALIDATION=1 LUXORA_NO_AUDIO=1
          mkdir -p shots
          # project manager
          xvfb-run -a -s "-screen 0 1600x940x24" ./build/luxora_editor --screenshot shots/project_manager.ppm --frames 30
          # editor with the sample project (fresh project = sample scene with GI, crowd, materials)
          xvfb-run -a -s "-screen 0 1600x940x24" ./build/luxora_editor --new $RUNNER_TEMP/vk "Vulkan Sample" --screenshot shots/editor.ppm --frames 60
          # play mode
          xvfb-run -a -s "-screen 0 1600x940x24" ./build/luxora_editor "$RUNNER_TEMP/vk/Vulkan Sample" --play --screenshot shots/editor_playing.ppm --frames 90
          # full scripted editor session on the real renderer (includes Close Project -> Project Manager -> reopen)
          LUXORA_SMOKE_SHOT=shots/save_prompt.ppm xvfb-run -a -s "-screen 0 1600x940x24" ./build/luxora_editor --new $RUNNER_TEMP/vksmoke "Vulkan Smoke" --smoke
          # random heavy use on the real renderer (validation layers catch GPU misuse)
          cp -r "$RUNNER_TEMP/vksmoke/Vulkan Smoke" $RUNNER_TEMP/vkstress
          LUXORA_STRESS_SEED=7 LUXORA_STRESS_PROJECT=$RUNNER_TEMP/vkstress xvfb-run -a -s "-screen 0 1600x940x24" ./build/luxora_editor $RUNNER_TEMP/vkstress --stress 600
          # the packaged game itself
          cd "$RUNNER_TEMP/projects/CI Sample/Builds/Linux/CI Sample"
          LUXORA_SCREENSHOT=$GITHUB_WORKSPACE/shots/game.ppm LUXORA_SCREENSHOT_FRAME=60 xvfb-run -a -s "-screen 0 1280x720x24" "./CI Sample"

      - name: Downloaded-editor flow (built-in script compiler, no engine source)
        run: |
          export HOME=$RUNNER_TEMP/home LUXORA_NO_AUDIO=1
          python3 tools/gen_script_api.py --check
          P=$RUNNER_TEMP/pkg
          mkdir -p $P/Runtime/Linux
          cp build/luxora_editor_nogpu $P/LuxoraEditor
          cp build/luxora_player $P/Runtime/Linux/LuxoraPlayer
          xvfb-run -a $P/LuxoraEditor --new $RUNNER_TEMP/pb "Prebuilt Game" --screenshot /dev/null --frames 3
          G="$RUNNER_TEMP/pb/Prebuilt Game"
          printf '#include <luxora/luxora.h>\n#include <stdio.h>\nLX_SCRIPT_REGISTER(ci_check) { printf("CI-SCRIPT-LOADED %%d\\n", 6 * 7); }\n' > "$G/Assets/Scripts/ci_check.c"
          xvfb-run -a $P/LuxoraEditor "$G" --build 2>&1 | tee pb.log
          grep -q "Compiled 2 scripts" pb.log
          grep -q "Build succeeded" pb.log
          B="$G/Builds/Linux/Prebuilt Game"
          test -f "$B/Data/scripts.lxo"
          if find "$B" -name '*.c' | grep -q .; then echo "script sources were shipped"; exit 1; fi
          cd "$B"
          LUXORA_VALIDATION=1 LUXORA_SCREENSHOT=$GITHUB_WORKSPACE/shots/prebuilt_game.ppm LUXORA_SCREENSHOT_FRAME=60 \
            xvfb-run -a -s "-screen 0 1280x720x24" "./Prebuilt Game" 2>&1 | tee $RUNNER_TEMP/game.log
          grep -q "CI-SCRIPT-LOADED 42" $RUNNER_TEMP/game.log

      - name: Convert screenshots
        if: always()
        run: |
          python3 -c "import glob; from PIL import Image; [Image.open(f).save(f[:-4]+'.png') for f in glob.glob('shots/*.ppm')]"
          ls -la shots || true
          # small previews embedded in the log (handy where artifacts can't be downloaded)
          python3 - <<'PY'
          import glob, base64, io
          from PIL import Image
          for f in sorted(glob.glob('shots/*.png')):
              im = Image.open(f).convert('RGB')
              im.thumbnail((1280, 1280))
              b = io.BytesIO(); im.save(b, 'JPEG', quality=80)
              print('LXSHOT-BEGIN', f.split('/')[-1])
              data = base64.b64encode(b.getvalue()).decode()
              for i in range(0, len(data), 1000): print('LXSHOT', data[i:i+1000])
              print('LXSHOT-END')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png

      - name: Package
        run: |
          # the editor (with its built-in script compiler) and the game player it packages games with - no engine source
          mkdir -p "linux-package/Luxora Editor/Runtime/Linux" "linux-package/Luxora Editor/Licenses"
          cp build/luxora_editor "linux-package/Luxora Editor/LuxoraEditor"
          cp README.md "linux-package/Luxora Editor/"
          cp build/luxora_player "linux-package/Luxora Editor/Runtime/Linux/LuxoraPlayer"
          cp third_party/tinycc/COPYING "linux-package/Luxora Editor/Licenses/TinyCC (LGPL-2.1).txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Luxora-Editor-Linux
          path: |
            linux-package/

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: build\Release\luxora_tests.exe
        env:
          LUXORA_KEEP_TEST_ICON: "1"

      - name: Build a game executable the way the editor does
        run: |
          cmake -S . -B build-game -A x64 -DLUXORA_BUILD_EDITOR=OFF -DLUXORA_BUILD_TESTS=OFF `
                -DLUXORA_GAME_NAME="CI Game" -DLUXORA_GAME_COMPANY="Luxora CI" -DLUXORA_GAME_VERSION="1.2.3" -DLUXORA_GAME_EXE="CI Game" `
                -DLUXORA_GAME_ICON="$PWD/test_icon.ico"
          cmake --build build-game --config Release --target luxora_player --parallel

      - name: Check the executables carry version info, a manifest and their icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $checks = @(
            @{ exe = "build\Release\LuxoraEditor.exe"; product = "Luxora Editor"; icon = "editor" },
            @{ exe = "build-game\Release\CI Game.exe"; product = "CI Game"; icon = "custom" },
            @{ exe = "patched_player.exe"; product = "Patched Game"; icon = "patched" }
          )
          foreach ($c in $checks) {
            $v = (Get-Item $c.exe).VersionInfo
            $v | Format-List ProductName, FileDescription, CompanyName, FileVersion, OriginalFilename
            if ($v.ProductName -ne $c.product) { throw "$($c.exe): ProductName is '$($v.ProductName)'" }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $c.exe))
            if (-not ([Text.Encoding]::ASCII.GetString($bytes).Contains("PerMonitorV2"))) { throw "$($c.exe): manifest missing" }
            $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $c.exe))
            $bmp = $ico.ToBitmap(); $ms = New-Object IO.MemoryStream; $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "LXICON $($c.icon) $([Convert]::ToBase64String($ms.ToArray()))"
          }

      # Optional: sign the executables when a code-signing certificate is configured.
      # Add repository secrets WINDOWS_CERT_PFX (base64 of the .pfx) and WINDOWS_CERT_PASSWORD.
      - name: Code signing
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) { Write-Host "No WINDOWS_CERT_PFX secret: executables are unsigned"; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD `
            build\Release\LuxoraEditor.exe build\Release\luxora_player.exe
          if ($LASTEXITCODE) { throw "signing failed" }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "Luxora Editor" | Out-Null
          Copy-Item build\Release\LuxoraEditor.exe "Luxora Editor\"
          Copy-Item README.md "Luxora Editor\README.md"
          # the editor (with its built-in script compiler) and the game player it packages games with - no engine source
          New-Item -ItemType Directory -Force "Luxora Editor\Runtime\Windows", "Luxora Editor\Licenses" | Out-Null
          Copy-Item build\Release\luxora_player.exe "Luxora Editor\Runtime\Windows\LuxoraPlayer.exe"
          Copy-Item third_party\tinycc\COPYING "Luxora Editor\Licenses\TinyCC (LGPL-2.1).txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Luxora-Editor-Windows
          path: Luxora Editor/

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create the sample project and stage its data
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libx11-dev xvfb
          cmake -S . -B host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build host --target luxora_editor_nogpu
          export HOME=$RUNNER_TEMP/home && mkdir -p $HOME
          LUXORA_NO_AUDIO=1 xvfb-run -a ./host/luxora_editor_nogpu --new $RUNNER_TEMP/p "Android Sample" --screenshot /dev/null --frames 3
          P="$RUNNER_TEMP/p/Android Sample"
          mkdir -p "$RUNNER_TEMP/stage/Data"
          cp -r "$P/Assets" "$RUNNER_TEMP/stage/Data/Assets"
          cp "$P/project.lxproj" "$P/input.lxinput" "$RUNNER_TEMP/stage/Data/"
      - name: Build APK
        run: |
          gradle -p android assembleDebug --no-daemon \
            -PluxoraProject="$RUNNER_TEMP/p/Android Sample" -PluxoraAssets="$RUNNER_TEMP/stage" \
            -PluxoraAppId=com.luxora.sample -PluxoraAppName="Luxora Sample" -PluxoraMinSdk=28 \
            -PluxoraBuildDir="$RUNNER_TEMP/apkbuild"
          ls -la $RUNNER_TEMP/apkbuild/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: luxora-android-sample-apk
          path: ${{ runner.temp }}/apkbuild/outputs/apk/debug/app-debug.apk

  # Publishes the downloads as a GitHub Release ("latest"): direct links that need no GitHub login,
  # one zip per platform instead of an artifact zip around a zip.
  release:
    name: Publish downloads
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir out
          mkdir -p win && mv dl/Luxora-Editor-Windows "win/Luxora Editor"
          (cd win && zip -qr ../out/Luxora-Editor-Windows.zip "Luxora Editor")
          (cd dl/Luxora-Editor-Linux && zip -qr ../../out/Luxora-Editor-Linux.zip .)
          cp dl/luxora-android-sample-apk/app-debug.apk out/Luxora-Android-Sample.apk
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --target "$GITHUB_SHA" --prerelease --title "Luxora Editor (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Windows: unzip and run LuxoraEditor.exe. Linux: unzip and run LuxoraEditor (needs Vulkan)."
